services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: synthkit-postgres
    environment:
      POSTGRES_USER: judge
      POSTGRES_PASSWORD: judge
      POSTGRES_DB: synthkit
    ports:
      - "5432:5432"
    volumes:
      - synthkit_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge -d synthkit"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  synthkit_pg:
